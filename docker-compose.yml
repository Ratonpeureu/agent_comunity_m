version: "3.8"

services:
  social-agent:
    build: .
    image: social-agent:latest
    container_name: social-agent
    restart: unless-stopped          # indispensable : l'app s'arrête après la sauvegarde du /setup et Docker la relance
    ports:
      - "${HOST_PORT:-8080}:${PORT:-8080}"
    volumes:
      - ./data:/data
    environment:
      - TZ=Africa/Dakar
      - PORT=${PORT:-8080}


networks:
  default: